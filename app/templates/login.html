{% extends 'base.html' %}

{% block content %}
<style>
    body { background-color: #fff; }
</style>

<div class="ns-auth">
    <div class="ns-auth-photo"><img src="/static/Backpack.jpg" alt="Backpack"></div>
    <div class="ns-auth-form">
        <h1>Already a user? Log in Here!</h1>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul class="ns-flash" style="margin: -8px 0 16px;">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
        {% endif %}
        {% endwith %}
        <form action="/login" method="post">
            <div class="ns-field">
                <label class="ns-label" for="username">Username</label>
                <input class="ns-input" type="text" id="username" name="username" required>
            </div>
            <div class="ns-field">
                <label class="ns-label" for="password">Password</label>
                <input class="ns-input" type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="ns-btn" style="width: 100%; margin-top: 6px; padding: 15px; font-size: 16px; min-height: 48px;">Login</button>
        </form>
        <p style="margin: 22px 0 0; font-size: 15px;">New here? <a href="/signup" style="color: #474795; font-weight: 600; text-decoration: underline;">Create Account</a></p>
    </div>
</div>
{% endblock %}
